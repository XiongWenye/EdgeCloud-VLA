[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_cloudedge_pi05"
version = "0.1.0"
description = "CloudEdgeVLA-style paired-frame flow-matching policy for LeRobot pi0.5"
requires-python = ">=3.10"
dependencies = [
  "lerobot[pi]==0.4.4",
  "transformers>=4.53,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

